<!doctype html>
<html><head><meta charset="utf-8"><title>Movies reimagined</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--rb:linear-gradient(180deg,#f6bf33 0 20%,#f08a25 20% 40%,#e2562b 40% 60%,#c2281d 60% 80%,#6b1a10 80%);--rbv:linear-gradient(90deg,#f6bf33 0 20%,#f08a25 20% 40%,#e2562b 40% 60%,#c2281d 60% 80%,#6b1a10 80%);--bg:#0b0807;--cream:#f6ecdb;--muted:#b6a896;--dim:#7f7366;--terra:#e27a49;--saff:#edbe56;--teal:#3aa597;
--glass:rgba(255,242,222,.075);--glass2:rgba(255,242,222,.13);--line:rgba(255,242,222,.14)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:var(--bg);overflow:hidden;font-family:Inter,sans-serif;color:var(--cream);-webkit-font-smoothing:antialiased}
.screen{display:none;position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
.serif{font-family:Fraunces,Georgia,serif;font-optical-sizing:auto}
svg.i{display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.abs{position:absolute}
/* ambient */
.amb{position:absolute;inset:0;background:
 radial-gradient(900px 600px at 88% -10%,rgba(226,122,73,.16),transparent 70%),
 radial-gradient(900px 700px at 0% 110%,rgba(58,165,151,.14),transparent 70%),
 radial-gradient(700px 500px at 50% 50%,rgba(237,190,86,.04),transparent 70%),var(--bg)}
.arch{position:absolute;left:50%;top:-140px;width:1500px;height:1500px;margin-left:-750px;border-radius:50%;
 border:1px solid rgba(237,190,86,.07);box-shadow:0 0 0 60px transparent,inset 0 0 0 80px rgba(237,190,86,.012)}
.arch.b{width:1100px;height:1100px;margin-left:-550px;top:60px;border-color:rgba(226,122,73,.07)}
.grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;pointer-events:none;
 background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
/* rail */
.rail{position:absolute;left:32px;top:32px;bottom:32px;width:92px;border-radius:46px;background:rgba(18,13,10,.62);
 border:1px solid var(--line);backdrop-filter:blur(30px);display:flex;flex-direction:column;align-items:center;padding:30px 0 26px;gap:12px;z-index:20}
.rail .logo{margin-bottom:26px}
.rail .nv{width:64px;height:64px;border-radius:32px;display:flex;align-items:center;justify-content:center;color:#a99b89;position:relative}
.rail .nv.on{background:var(--glass2);color:var(--saff);box-shadow:inset 0 0 0 1px rgba(237,190,86,.35),0 8px 24px rgba(0,0,0,.4)}
.rail .nv.on::before{content:"";position:absolute;left:-17px;top:16px;width:8px;height:32px;border-radius:4px;background:var(--rbv)}
.rail .sp{flex:1}
/* type */
.eyebrow{font-size:17px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--saff);display:flex;align-items:center;gap:14px}
.eyebrow i{display:inline-block;width:40px;height:10px;border-radius:5px;background:var(--rb)}
.eyebrow .dot{width:5px;height:5px;border-radius:3px;background:var(--saff);opacity:.6}
.title{font-family:Fraunces,Georgia,serif;font-weight:400;letter-spacing:-.02em;line-height:1;color:var(--cream)}
.meta{display:flex;align-items:center;gap:16px;font-size:23px;color:var(--muted);font-weight:400}
.meta .dotsep{width:4px;height:4px;border-radius:2px;background:var(--dim)}
.cert{border:1.5px solid rgba(246,236,219,.45);border-radius:6px;padding:1px 9px;font-size:19px;font-weight:600;color:var(--cream);letter-spacing:.03em}
.imdb{display:flex;align-items:center;gap:8px;color:var(--cream);font-weight:500}
.imdb svg{color:var(--saff)}
.prov{display:inline-flex;align-items:center;gap:12px;font-size:22px;color:var(--cream);background:var(--glass);border:1px solid var(--line);
 padding:8px 18px 8px 10px;border-radius:30px;backdrop-filter:blur(12px)}
.prov b{width:28px;height:28px;border-radius:14px;background:linear-gradient(135deg,var(--terra),var(--saff));display:flex;align-items:center;justify-content:center;color:#1a0f08}
.prov em{font-style:normal;color:var(--saff);font-weight:500}
.syn{font-size:26px;line-height:1.5;color:#d7cbb9;font-weight:300}
/* buttons */
.btn{height:76px;border-radius:38px;padding:0 38px 0 30px;display:inline-flex;align-items:center;gap:14px;font-size:25px;font-weight:600;
 background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(20px);color:var(--cream)}
.btn.primary{background:var(--cream);color:#1b120c;border-color:transparent;box-shadow:0 14px 40px rgba(246,236,219,.18),0 0 0 6px rgba(246,236,219,.12)}
.btn.terra{background:linear-gradient(135deg,#eb8a56,#d4623a);color:#1d0d05;border-color:transparent;box-shadow:0 14px 40px rgba(226,122,73,.35),0 0 0 6px rgba(226,122,73,.18)}
.btn.danger{color:#f0a48a}
.btn svg{width:30px;height:30px}
.btn.sq{padding:0 30px}
/* rows */
.rowhead{display:flex;align-items:baseline;gap:18px}
.rowhead h2{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:38px;letter-spacing:-.01em;display:flex;align-items:center;gap:18px}
.rowhead h2::before{content:"";width:14px;height:30px;border-radius:7px;background:var(--rbv)}
.rowhead .ct{font-size:20px;color:var(--dim);font-weight:500;letter-spacing:.04em}
.rowhead .more{margin-left:auto;font-size:19px;color:var(--dim);display:flex;gap:8px;align-items:center;letter-spacing:.06em}
.card{position:absolute;display:block}
.card .p{width:100%;border-radius:16px;overflow:hidden;background:#221a15 center/cover;position:relative;
 box-shadow:0 18px 40px rgba(0,0,0,.45),inset 0 0 0 1px rgba(255,242,222,.06)}
.card .p::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.25))}
.card .t{margin-top:16px;font-size:21px;font-weight:500;color:#cdbfad;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:17px;color:var(--dim);margin-top:4px;opacity:0}
.card.f{transform:scale(1.1);z-index:5;transform-origin:50% 35%}
.card.f .p{box-shadow:0 0 0 4px var(--cream),0 0 0 9px rgba(237,190,86,.28),0 34px 70px rgba(0,0,0,.65),0 0 90px rgba(237,190,86,.16)}
.card.f .t{color:var(--cream);font-weight:600}
.card.f .s{opacity:1}
.badge{position:absolute;left:12px;bottom:12px;z-index:3;display:flex;align-items:center;gap:7px;background:rgba(12,8,6,.72);backdrop-filter:blur(14px);
 border:1px solid rgba(237,190,86,.5);color:var(--saff);font-size:14px;font-weight:700;letter-spacing:.14em;padding:7px 12px 7px 9px;border-radius:20px}
.badge svg{width:15px;height:15px;stroke-width:2.6}
.fade-r{position:absolute;top:0;bottom:0;right:0;width:220px;background:linear-gradient(90deg,transparent,var(--bg) 95%);z-index:8;pointer-events:none}
/* hero */
.bd{position:absolute;background-size:cover;background-position:center}
.mk{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 38%);mask-image:linear-gradient(90deg,transparent 0,#000 38%)}
.seg{display:flex;gap:8px}
.seg i{display:block;width:64px;height:10px;border-radius:5px;background:rgba(246,236,219,.22);overflow:hidden;position:relative}
.seg i.on{background:var(--rb)}
.top10{position:absolute}
.top10 .n{position:absolute;left:0;font-family:Fraunces,Georgia,serif;font-weight:600;font-size:210px;line-height:.8;letter-spacing:-.06em;
 color:transparent;-webkit-text-stroke:2.5px rgba(237,190,86,.6)}
/* downloads */
.dl{position:absolute;left:176px;right:96px;height:128px;border-radius:26px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(16px);display:flex;align-items:center;padding:0 36px 0 20px;gap:28px}
.dl .th{width:68px;height:96px;border-radius:10px;background:#221a15 center/cover;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.dl .nm{font-size:27px;font-weight:500}
.dl .nm span{color:var(--muted);font-weight:300}
.dl .st{display:flex;align-items:center;gap:10px;font-size:19px;color:var(--muted);margin-top:8px}
.dl .st b{width:9px;height:9px;border-radius:5px;background:var(--saff)}
.dl .bar{height:14px;border-radius:7px;background:rgba(246,236,219,.08);margin-top:14px;overflow:hidden;position:relative}
.dl .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--rb)}
.dl .bar i.ind{left:18%;width:22%;background:var(--rb);-webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(90deg,transparent,#000 30%,#000 70%,transparent)}
.dl .pc{font-family:Fraunces,Georgia,serif;font-size:44px;width:120px;text-align:right;color:var(--cream)}
.dl.f{background:rgba(255,242,222,.14);box-shadow:0 0 0 3px var(--cream),0 0 0 8px rgba(237,190,86,.25),0 20px 50px rgba(0,0,0,.5)}
.stat{position:absolute;top:262px;height:96px;width:276px;border-radius:22px;background:var(--glass);border:1px solid var(--line);padding:16px 24px}
.stat .v{font-family:Fraunces,Georgia,serif;font-size:42px;line-height:1}
.stat .l{font-size:15px;letter-spacing:.12em;white-space:nowrap;text-transform:uppercase;color:var(--dim);margin-top:6px;font-weight:500}
/* kb */
.key{position:absolute;width:96px;height:84px;border-radius:18px;background:var(--glass);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:400;color:#e6dac8}
.key.f{background:var(--cream);color:#1b120c;font-weight:600;transform:scale(1.12);z-index:3;box-shadow:0 12px 30px rgba(0,0,0,.5),0 0 0 6px rgba(246,236,219,.16)}
.key.w{font-size:20px;color:var(--muted);letter-spacing:.05em}
.chip{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 26px;border-radius:28px;background:var(--glass);border:1px solid var(--line);font-size:23px;color:#ddd0bd}
.mic{width:84px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;color:#1d0d05;background:radial-gradient(circle at 50% 40%,#f6bf33,#e2562b);box-shadow:0 0 0 7px rgba(226,86,43,.25),0 0 0 15px rgba(240,138,37,.12)}
.arches{position:absolute;inset:0;pointer-events:none;-webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 80%);mask-image:linear-gradient(100deg,transparent 30%,#000 80%)}
.mic{width:84px;height:84px;border-radius:42px;display:flex;align-items:center;justify-content:center;color:#1d0d05;background:radial-gradient(circle at 50% 40%,#f6bf33,#e2562b);box-shadow:0 0 0 7px rgba(226,86,43,.25),0 0 0 15px rgba(240,138,37,.12)}
.arches{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;-webkit-mask-image:linear-gradient(100deg,transparent 30%,#000 80%);mask-image:linear-gradient(100deg,transparent 30%,#000 80%)}
</style></head>
<body>
<div id="root"></div>
<script>
const P=(d,o={})=>`<svg class="i" viewBox="0 0 24 24" width="${o.s||32}" height="${o.s||32}" ${o.f?'style="fill:currentColor;stroke:none"':''}>${d}</svg>`;
const IC={
search:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/>',
home:'<path d="M3.5 11L12 3.5 20.5 11"/><path d="M5.5 9.8V20h4.5v-5.5h4V20h4.5V9.8"/>',
film:'<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M8 3.5v17M16 3.5v17M3.5 8h4.5M3.5 12h4.5M3.5 16h4.5M16 8h4.5M16 12h4.5M16 16h4.5"/>',
tv:'<rect x="2.8" y="4" width="18.4" height="12.8" rx="2.6"/><path d="M8 21h8M12 16.8V21"/><path d="M10.4 8.2l4 2.2-4 2.2z" fill="currentColor"/>',
doc:'<path d="M6 3.5h8l4.5 4.5v12.5H6z"/><path d="M14 3.5V8h4.5M9 13h6.5M9 16.5h6.5"/>',
lib:'<rect x="3.5" y="4" width="4.2" height="16" rx="1.2"/><rect x="9.6" y="4" width="4.2" height="16" rx="1.2"/><path d="M16 5.6l3.6-1 3 14.6-3.6 1z" transform="translate(-1 0)"/>',
dl:'<path d="M12 3.5v11.5M7.5 10.8L12 15.3l4.5-4.5M4.5 20h15"/>',
play:'<path d="M7 4.6v14.8L19.6 12z" />',
info:'<circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.2M12 7.8v.1"/>',
back:'<path d="M19 12H5.5M11 5.8L4.8 12l6.2 6.2"/>',
trash:'<path d="M4.5 6.8h15M9.5 6.8V4.4h5v2.4M6.4 6.8l.9 12.7h9.4l.9-12.7M10 10.6v5.6M14 10.6v5.6"/>',
check:'<path d="M5 12.5l4.6 4.6L19 7.6"/>',
star:'<path d="M12 3.4l2.5 5.4 5.9.7-4.4 4 1.2 5.8L12 16.4 6.8 19.3 8 13.5 3.6 9.5l5.9-.7z" style="fill:currentColor;stroke:none"/>',
chev:'<path d="M9 5l7 7-7 7"/>',
cc:'<rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M10.2 10.4a2.3 2.3 0 100 3.2M16.6 10.4a2.3 2.3 0 100 3.2"/>',
sliders:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/>',
prev:'<path d="M6 5v14M19 5.5v13L8.5 12z"/>',
next:'<path d="M18 5v14M5 5.5v13L15.5 12z"/>',
pause:'<rect x="6.5" y="4.5" width="3.8" height="15" rx="1.2"/><rect x="13.7" y="4.5" width="3.8" height="15" rx="1.2"/>',
b10:'<path d="M4.2 12a8 8 0 108-8H9M9 1.6L5.8 4.2 9 6.8"/><text x="12" y="15.6" font-size="7.4" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="Inter">10</text>',
f10:'<path d="M19.8 12a8 8 0 11-8-8H15M15 1.6l3.2 2.6L15 6.8"/><text x="12" y="15.6" font-size="7.4" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="Inter">10</text>',
x:'<path d="M5 5l14 14M19 5L5 19"/>',
bksp:'<path d="M9 5.5h11a1 1 0 011 1v11a1 1 0 01-1 1H9l-6.2-6.5z"/><path d="M12.5 9.6l5 5M17.5 9.6l-5 5"/>',
vol:'<path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4.2 4.2 0 010 6M18 6.6a7.8 7.8 0 010 10.8"/>',
mic:'<rect x="9" y="3" width="6" height="11.5" rx="3"/><path d="M5.5 11.2a6.5 6.5 0 0013 0M12 17.7V21M8.5 21h7"/>',
mic:'<rect x="9" y="3" width="6" height="11.5" rx="3"/><path d="M5.5 11.2a6.5 6.5 0 0013 0M12 17.7V21M8.5 21h7"/>',
trend:'<path d="M3.5 16.5l5.5-5.5 3.8 3.8 7-7.6M15 7.2h5.3v5.3"/>',
clock:'<circle cx="12" cy="12" r="8.6"/><path d="M12 7.2V12l3.4 2"/>'};
const ic=(n,s,f)=>P(IC[n],{s,f});

const RC=['#5d1710','#c2281d','#e2562b','#f08a25','#f6bf33'];
const ribbon=(d,w,o={})=>{const n=RC.length;return `<svg class="abs" style="left:0;top:0;pointer-events:none;${o.style||''}" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" opacity="${o.op??1}">${RC.map((c,i)=>`<path d="${d}" stroke="${c}" stroke-width="${w*(n-i)/n}" stroke-linejoin="round" stroke-linecap="butt"/>`).join('')}</svg>`};
const ARCH=`<svg class="arches" viewBox="0 0 1920 1080" opacity=".2"><g>
<path d="M1170 1100V560a150 150 0 01300 0v540z" fill="#e0a93a"/><path d="M1400 1100V470a130 130 0 01260 0v630z" fill="#c4532a"/>
<path d="M1640 1100V720a140 140 0 01280 0v380z" fill="#6e2214"/><path d="M1290 1100V820a160 160 0 01320 0v280z" fill="#4d5b2c" opacity=".9"/></g></svg>`;
const markSvg=(sz)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 56 56"><circle cx="28" cy="28" r="27" fill="#6b1a10"/><circle cx="28" cy="28" r="22" fill="#c2281d"/><circle cx="28" cy="28" r="17" fill="#e2562b"/><circle cx="28" cy="28" r="12" fill="#f08a25"/><circle cx="28" cy="28" r="7.2" fill="#f6bf33"/><path d="M25.2 24.2v7.6a1 1 0 001.5.86l6.3-3.8a1 1 0 000-1.72l-6.3-3.8a1 1 0 00-1.5.86z" fill="#1b0d06"/></svg>`;

const logo=markSvg(56);
const rail=(on)=>`<div class="rail"><div class="logo">${logo}</div>
${['search','home','film','tv','doc','lib','dl'].map(n=>`<div class="nv ${n==on?'on':''}">${ic(n,36)}</div>`).join('')}<div class="sp"></div></div>`;
const img=n=>`img/${n}.jpg`;
const card=(x,y,w,h,im,t,o={})=>`<div class="card ${o.f?'f':''}" style="left:${x}px;top:${y}px;width:${w}px"><div class="p" style="height:${h}px;background-image:url(${img(im)})">${o.badge?`<div class="badge">${ic('check',15)}IN LIBRARY</div>`:''}</div>${t?`<div class="t">${t}</div><div class="s">${o.sub||''}</div>`:''}</div>`;
const meta=(a)=>`<div class="meta">${a.map((x,i)=>(i?'<span class="dotsep"></span>':'')+x).join('')}</div>`;
const imdb=v=>`<span class="imdb">${ic('star',22)}${v}</span>`;
const bdgrad=(l)=>`<div class="abs" style="inset:0;background:linear-gradient(90deg,rgba(11,8,7,${l}) 0%,rgba(11,8,7,.85) 34%,rgba(11,8,7,.25) 66%,rgba(11,8,7,.1) 100%)"></div><div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(11,8,7,.55) 0%,transparent 22%,transparent 50%,rgba(11,8,7,.96) 100%)"></div>`;
const S={};
const key=(k,l)=>`<span style="display:inline-flex;align-items:center;gap:10px"><span style="border:1px solid var(--line);background:var(--glass);border-radius:9px;padding:5px 12px;color:var(--cream);font-weight:600;font-size:17px">${k}</span>${l}</span>`;
const HINT=`<div class="abs" style="left:96px;bottom:48px;display:flex;gap:36px;font-size:18px;color:var(--dim);letter-spacing:.04em">${key('◀ ▶','Browse')}${key('OK','Open')}${key('▲','Back to details')}</div>`;

/* 01 movies top */
S['01-movies-top']=()=>`<div class="screen">
<div class="bd mk" style="top:0;bottom:0;right:0;width:1230px;background-image:url(${img("backrooms-bd")});filter:saturate(1.1)"></div>${bdgrad(.98)}
${rail('film')}
<div class="abs" style="left:184px;top:140px;width:1040px">
 <div class="eyebrow"><i></i>Featured<span class="dot"></span>#1 in films today</div>
 <div class="title" style="font-size:128px;margin-top:26px">Backrooms</div>
 <div style="margin-top:30px">${meta(['<span class="cert">15</span>','2026','1h 51m','Horror · Mystery &amp; Thriller · Sci-Fi',imdb('6.7')])}</div>
 <div class="syn" style="margin-top:26px;width:820px">A strange doorway appears in the basement of a furniture showroom.</div>
 <div style="margin-top:30px"><span class="prov"><b>${ic('play',14,1)}</b>Streaming on <em>HBO Max</em></span></div>
 <div style="margin-top:34px;display:flex;gap:20px"><div class="btn primary">${ic('play',30,1)}Stream now</div><div class="btn">${ic('info',30)}More info</div></div>
</div>
<div class="abs seg" style="left:184px;top:744px"><i class="on"></i><i></i><i></i></div>
<div class="abs rowhead" style="left:184px;top:812px;width:1660px"><h2>Top 10 films</h2><span class="more">SEE ALL ${ic('chev',18)}</span></div>
${[['backrooms',1],['tenzing',2],['love',3],['sleep',4],['weapons',5]].map(([im,n],k)=>{const x=184+k*350;return `<div class="top10" style="left:${x}px;top:906px;width:350px"><div class="n" style="top:70px">${n}</div>${card(118,0,224,336,im,'',{f:k==0})}</div>`}).join('')}
<div class="grain"></div></div>`;

/* 02 rows */
